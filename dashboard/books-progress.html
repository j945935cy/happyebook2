          <p>追蹤每一本新書目前卡在哪個階段，先看完成度、下一步與期限，再進入子目錄處理細節。</p>

              <div class="filter-bar">
                <div class="search-group">
                  <label class="search-label" for="project-search">搜尋新書</label>
                  <input id="project-search" class="search-input" data-project-search type="search" placeholder="輸入書名、分類或下一步" autocomplete="off">

                <div class="filter-group" data-project-status-filters>
                  <button class="filter-chip is-active" data-project-status="all" type="button">全部</button>
                  <button class="filter-chip" data-project-status="planning" type="button">規劃中</button>
                  <button class="filter-chip" data-project-status="writing" type="button">寫作中</button>
                  <button class="filter-chip" data-project-status="reviewing" type="button">校稿中</button>
                  <button class="filter-chip" data-project-status="packaging" type="button">製作上架檔</button>
                  <button class="filter-chip" data-project-status="submitted" type="button">已送審</button>
                  <button class="filter-chip" data-project-status="published" type="button">已出版</button>
                  <button class="filter-chip" data-project-status="paused" type="button">暫停</button>
                </div>
