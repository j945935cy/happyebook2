<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1152" viewBox="0 0 768 1152" role="img" aria-labelledby="title desc">
  <title id="title">iPAS AI 規劃師一次考過書封</title>
  <desc id="desc">藍色科技線條背景，主標題為 iPAS AI 規劃師一次考過，副標為從觀念到情境題的完整攻略。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C224D"/>
      <stop offset=".45" stop-color="#2167B5"/>
      <stop offset="1" stop-color="#081B3E"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#87D7FF" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#3489D4" stop-opacity=".48"/>
      <stop offset="1" stop-color="#0C2E67" stop-opacity=".1"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#07142C" flood-opacity=".7"/>
    </filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#78C7FF" stroke-width="1" opacity=".22"/>
    </pattern>
  </defs>

  <rect width="768" height="1152" fill="url(#bg)"/>
  <rect width="768" height="1152" fill="url(#grid)" opacity=".85"/>
  <path d="M-40 885C145 745 190 600 262 370 330 154 432 73 806 42v1110H-40Z" fill="url(#light)" opacity=".9"/>
  <path d="M-30 368C144 278 212 118 364 86c116-24 214 28 434-36" fill="none" stroke="#48A9FF" stroke-width="3" opacity=".72"/>
  <path d="M-22 266C96 234 167 162 250 122c129-63 243-32 373-84" fill="none" stroke="#3E98EC" stroke-width="2" opacity=".55"/>
  <path d="M76 0C126 165 112 326 53 482-5 635 5 774 87 930" fill="none" stroke="#9EDCFF" stroke-width="2" opacity=".28"/>
  <path d="M188 0C219 140 209 296 162 442 107 612 116 787 226 1025" fill="none" stroke="#9EDCFF" stroke-width="2" opacity=".22"/>
  <g fill="none" stroke="#7ED6FF" opacity=".24">
    <path d="M42 214h270M38 274h324M44 334h292M48 394h240M52 454h208"/>
    <path d="M44 214v260M102 198v320M160 184v356M218 170v392M276 150v426"/>
  </g>

  <g font-family="'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', 'Segoe UI', sans-serif" text-anchor="middle" filter="url(#soft-shadow)">
    <text x="384" y="158" fill="#F7FBFF" font-size="72" font-weight="800" letter-spacing="2">iPAS AI 規劃師</text>
    <text x="384" y="254" fill="#F7FBFF" font-size="72" font-weight="800">一次考過</text>
    <text x="384" y="360" fill="#F5FBFF" font-size="36" font-weight="500">從觀念到情境題的完整攻略</text>
  </g>

  <g font-family="'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', 'Segoe UI', sans-serif">
    <rect x="67" y="409" width="634" height="40" fill="#D56A00"/>
    <text x="384" y="437" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="500">「國家級證照｜企業優先錄取｜零基礎一次過關｜2026最新考綱全攻略」</text>
  </g>

  <g font-family="'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', 'Segoe UI', sans-serif" fill="#FFFFFF" font-size="28" opacity=".96">
    <circle cx="110" cy="546" r="13"/>
    <text x="134" y="557">完整對齊 iPAS AI 規劃師最新考綱</text>
    <circle cx="110" cy="591" r="13"/>
    <text x="134" y="602">用白話拆解 AI 核心觀念，非資工背景也能讀懂</text>
    <circle cx="110" cy="636" r="13"/>
    <text x="134" y="647">大量情境式題型解析，掌握命題方向</text>
    <circle cx="110" cy="681" r="13"/>
    <text x="134" y="692">聚焦「會考的重點」，避免無效背誦</text>
    <circle cx="110" cy="726" r="13"/>
    <text x="134" y="737">適合第一次報考與短期衝刺準備</text>
  </g>

  <g font-family="'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', 'Segoe UI', sans-serif" fill="#FFFFFF">
    <text x="384" y="948" text-anchor="middle" font-size="26" font-style="italic" font-weight="500">準備策略全解析？常考情境題？一次考過關鍵整理</text>
    <g font-size="22" opacity=".95">
      <circle cx="137" cy="1020" r="11"/>
      <text x="160" y="1028">適用對象：大專生、社會新鮮人、教師、在職進修者</text>
      <circle cx="137" cy="1060" r="11"/>
      <text x="160" y="1068">不需程式背景，也能建立 AI 規劃與應用判斷力</text>
      <circle cx="137" cy="1100" r="11"/>
      <text x="160" y="1108">搭配實務案例，培養考試與實務兼具的 AI 素養</text>
    </g>
  </g>

  <g opacity=".38" fill="#DDF5FF">
    <path d="M662 766h98v260h-98z"/>
    <path d="M610 807h98v219h-98z"/>
    <path d="M558 848h98v178h-98z"/>
  </g>
</svg>
