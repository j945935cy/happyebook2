<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1440" viewBox="0 0 960 1440" fill="none">
  <rect width="960" height="1440" fill="#FFF7ED"/>
  <rect x="64" y="64" width="832" height="1312" rx="36" fill="#FFFFFF" stroke="#F9A853" stroke-width="4"/>
  <rect x="64" y="64" width="832" height="260" rx="36" fill="#EA580C"/>
  <path d="M64 272H896V324H64V272Z" fill="#2563EB"/>
  <text x="120" y="170" fill="#FFFFFF" font-size="54" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-weight="700">用 AI + Sigil</text>
  <text x="120" y="248" fill="#FED7AA" font-size="38" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif">製作 EPUB 電子書</text>
  <!-- AI icon area -->
  <rect x="120" y="380" width="160" height="160" rx="24" fill="#FFF7ED"/>
