  <!-- Plus sign -->
  <text x="298" y="500" fill="#9CA3AF" font-size="72" font-family="sans-serif" font-weight="300">+</text>
  <!-- Sigil icon area -->
  <rect x="380" y="380" width="160" height="160" rx="24" fill="#EFF6FF"/>
  <text x="405" y="490" fill="#2563EB" font-size="68" font-family="'Trebuchet MS', sans-serif" font-weight="800">Sig</text>
  <text x="405" y="535" fill="#93C5FD" font-size="36" font-family="'Trebuchet MS', sans-serif">il</text>
  <!-- EPUB badge -->
  <rect x="600" y="390" width="200" height="72" rx="16" fill="#EA580C"/>
  <text x="640" y="436" fill="#FFFFFF" font-size="40" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="800">EPUB</text>
  <!-- Divider -->
  <line x1="120" y1="600" x2="840" y2="600" stroke="#FED7AA" stroke-width="4"/>
  <!-- Description lines -->
  <g font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="34" fill="#374151">
